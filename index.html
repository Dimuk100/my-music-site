<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dima Vardzelashvili - Music Artist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navigation -->
  <nav>
    <ul>
      <li><a href="#profile">Profile</a></li>
      <li><a href="#music">Music</a></li>
      <li><a href="#gallery">Gallery</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- Hero Section -->
  <header class="hero">
    <h1>Dima Vardzelashvili</h1>
    <p>Musician • Composer • Creator</p>
    <button>Listen Music</button>
    <button>Follow</button>
  </header>

  <!-- Profile -->
  <section id="profile">
    <img src="images/artist-hero.png" alt="Artist portrait">
    <p>ბიოგრაფია ქართულად...</p>
    <!-- social icons -->
  </section>

  <!-- Music -->
  <section id="music">
    <h2>Music</h2>
    <ul>
      <li>You Light My Days – 3:20</li>
      <li>New Melody – 2:54</li>
    </ul>
    <!-- player -->
  </section>

  <!-- Gallery -->
  <section id="gallery">
    <h2>Gallery</h2>
    <img src="images/gallery-1.png" alt="">
    <img src="images/gallery-2.png" alt="">
    <img src="images/gallery-3.png" alt="">
    <img src="images/gallery-4.png" alt="">
  </section>

  <!-- Contact -->
  <section id="contact">
    <h2>Contact Me</h2>
    <form>
      <input type="text" placeholder="Your Name">
      <input type="email" placeholder="Your Email">
      <textarea placeholder="Your Message"></textarea>
      <button type="submit">Send Message</button>
    </form>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2025 Dima Vardzelashvili | All Rights Reserved</p>
    <form>
      <input type="email" placeholder="Share your Newsletter">
      <button type="submit">Subscribe</button>
    </form>
  </footer>
</body>
</html>
